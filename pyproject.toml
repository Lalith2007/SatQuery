[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satquery"
version = "0.1.0"
description = "SatQuery AI: Agentic Vision-Language Assistant for Remote-Sensing Imagery (Division 1: Agent Core + Backend + Orchestration)"
authors = [
    { name = "Lalith Praveen", email = "lalithpraveenaradhyulaedu@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pillow>=10.2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "tifffile>=2024.2.12",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "validation*", "registry*", "specialists*", "agent*", "app*"]
