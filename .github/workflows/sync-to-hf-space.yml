name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "[ERROR] HF_TOKEN secret is not configured in GitHub repository secrets."
            echo "Please add HF_TOKEN with Write permission in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # Add Hugging Face Space as a remote and push main
          git remote add space https://Lalith2007:$HF_TOKEN@huggingface.co/spaces/Lalith2007/SatQuery-Space || true
          git push --force space main
